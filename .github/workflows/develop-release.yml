name: Develop Branch Release

# Requires repo secret DEVELOP_RELEASE_TOKEN (PAT with contents write; account must be allowed to push develop).
# Checkout uses that token for git push. If the next beta tag already exists remotely, CI bumps to
# the next free prerelease and runs standard-version --release-as (existing tags are not deleted).
# Release commits include [skip ci] via .versionrc.json so the automation push does not re-trigger this job.
on:
  push:
    branches:
      - develop

concurrency:
  group: develop-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.DEVELOP_RELEASE_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and update package.json
        id: check_package
        run: |
          MAIN=$(node -p "require('./package.json').main")
          TYPES=$(node -p "require('./package.json').types")

          if [ "$MAIN" = "src/index.tsx" ] || [ "$TYPES" = "src/index.tsx" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            node -e "
              const fs = require('fs');
              const pkg = require('./package.json');
              pkg.main = 'dist/index.js';
              pkg.types = 'dist/index.d.ts';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            echo "Updated package.json main and types"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "package.json already configured correctly"
          fi

      - name: Delete existing dist folder
        run: |
          if [ -d "dist" ]; then
            rm -rf dist
            echo "Deleted existing dist folder"
          else
            echo "No dist folder to delete"
          fi

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Commit build changes
        run: |
          git add dist/

          if [ "${{ steps.check_package.outputs.needs_update }}" = "true" ]; then
            git add package.json
          fi

          if git diff --staged --quiet; then
            echo "No build output changes to commit; continuing to version step"
            exit 0
          fi

          if [ "${{ steps.check_package.outputs.needs_update }}" = "true" ]; then
            git commit -m "chore: update build config and dist [skip ci]"
            echo "Committed package.json and dist folder"
          else
            git commit -m "chore: update dist [skip ci]"
            echo "Committed dist folder"
          fi

      - name: Next beta version (skip if tag already exists)
        id: next_rel
        run: echo "version=$(node scripts/ci/next-free-beta-version.cjs)" >> "$GITHUB_OUTPUT"

      # CI uses --release-as (not --prerelease) when combined with a pinned version. One build above is enough.
      - name: Release beta (version, changelog, tag, push)
        run: |
          npm run release:BE:version:as -- --release-as "${{ steps.next_rel.outputs.version }}"
          git push origin develop --follow-tags
